services:
  - type: web
    name: deepcut-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: deepcut_sports
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: ADALO_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: BETA_ACCESS_CODE
        sync: false
      - key: BETA_COHORT
        value: closed_alpha_1
      - key: FULL_APP_BOOTSTRAP_EMAILS
        sync: false

  - type: web
    name: deepcut-sports-web
    runtime: static
    rootDir: frontend
    buildCommand: yarn install --non-interactive && yarn build:web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_BACKEND_URL
        sync: false
      - key: EXPO_PUBLIC_BETA_MODE
        value: "true"
      - key: EXPO_PUBLIC_BETA_VERSION
        value: Closed Alpha 1
