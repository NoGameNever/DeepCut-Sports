name: Migration CI

on:
  push:
    branches:
      - feature/adalo-replacement-foundation
      - feature/question-bank-v2
      - feature/question-bank-seed-v1
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: deepcut_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Compile backend
        run: python -m compileall backend
      - name: Backend unit tests
        run: pytest backend/tests/test_auth_native.py backend/tests/test_question_bank_v2.py -q
      - name: Validate question-bank seed
        run: python backend/seed_question_bank_v1.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm install --ignore-scripts
      - name: TypeScript check
        run: npx tsc --noEmit
